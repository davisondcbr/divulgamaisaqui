<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b34">
<title>Site | DIVULGA+AQUI</title>
<style>
:root{--ink:#071b34;--blue:#087ff0;--green:#65d500;--bg:#f5f8fc;--muted:#65758a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}.wrap{width:min(1160px,calc(100% - 32px));margin:auto}
header{position:sticky;top:0;z-index:20;background:#ffffffeb;backdrop-filter:blur(14px);border-bottom:1px solid #e3eaf2}
.nav{height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:25px;font-weight:1000;letter-spacing:-1.4px}.brand i{font-style:normal;color:var(--green)}
.links{display:flex;gap:22px;font-weight:800;font-size:14px}.cta{background:#18b955;color:white;padding:12px 17px;border-radius:999px;font-weight:900}
.hero{min-height:620px;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#071b34,#0b4d88);color:white}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.38;transform:scale(1.03)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#05182edb,#05182e4d)}
.hero-content{position:relative;z-index:2;width:min(900px,calc(100% - 32px));text-align:center;padding:80px 0}
.logo{width:120px;height:120px;border-radius:24px;object-fit:contain;background:#fff;padding:10px;margin-bottom:22px;box-shadow:0 15px 50px #0005}
.hero h1{font-size:clamp(42px,7vw,78px);line-height:.98;margin:0 0 18px;letter-spacing:-3px}.hero p{font-size:20px;line-height:1.6;max-width:720px;margin:0 auto 28px;color:#e0ecf8}
.hero-buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.hero-buttons a{padding:14px 22px;border-radius:999px;font-weight:900}.whats{background:#19bf59;color:white}.outline{border:1px solid #ffffff88;color:#fff}
section{padding:85px 0}.title{text-align:center;margin-bottom:40px}.title small{color:var(--blue);font-weight:1000;text-transform:uppercase;letter-spacing:2px}.title h2{font-size:clamp(30px,4vw,46px);margin:8px 0 0;letter-spacing:-1.5px}
.about{background:#fff}.about-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:center}.about-text{font-size:18px;line-height:1.8;color:#47576b}.info{display:grid;gap:12px}.info-card{background:#f2f7fd;padding:18px;border-radius:15px;border:1px solid #dfebf6}.info-card b{display:block;margin-bottom:5px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;box-shadow:0 8px 25px #0b284318;cursor:pointer;transition:.25s}.gallery img:hover{transform:translateY(-4px)}
.contact{background:linear-gradient(135deg,#071b34,#0a467d);color:#fff;text-align:center}.contact h2{font-size:42px;margin:0 0 14px}.contact p{color:#c9dbed;font-size:18px;margin-bottom:28px}
footer{background:#041426;color:#9fb3c8;padding:30px 0}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.powered{font-weight:900;color:#fff}.powered i{font-style:normal;color:var(--green)}
.loading,.error{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}.loader{width:48px;height:48px;border:5px solid #d7e7f5;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}
.error h1{font-size:42px;margin-bottom:10px}.error p{color:var(--muted);font-size:18px}.hidden{display:none!important}
.lightbox{position:fixed;inset:0;background:#000d;z-index:100;display:grid;place-items:center;padding:25px}.lightbox img{max-width:95vw;max-height:90vh;border-radius:14px}
@media(max-width:760px){.links{display:none}.about-grid{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}.hero{min-height:570px}.hero h1{letter-spacing:-2px}}
@media(max-width:480px){.gallery{grid-template-columns:1fr}.nav{height:66px}.brand{font-size:21px}}
</style>
</head>
<body>
<div id="loading" class="loading"><div><div class="loader"></div><b>Carregando site...</b></div></div>
<div id="error" class="error hidden"><div><h1>Site não encontrado</h1><p>Confira o código informado ou entre em contato com o DIVULGA+AQUI.</p></div></div>

<div id="site" class="hidden">
<header><div class="wrap nav">
 <a href="#" class="brand">DIVULGA<i>+</i>AQUI</a>
 <nav class="links"><a href="#sobre">Sobre</a><a href="#fotos">Fotos</a><a href="#contato">Contato</a></nav>
 <a id="topWhats" class="cta" target="_blank" rel="noopener">WhatsApp</a>
</div></header>

<main>
<section class="hero">
 <div id="heroBg" class="hero-bg"></div>
 <div class="hero-content">
  <img id="logo" class="logo hidden" alt="Logo">
  <h1 id="name"></h1><p id="heroDesc"></p>
  <div class="hero-buttons"><a id="heroWhats" class="whats" target="_blank" rel="noopener">Falar no WhatsApp</a><a href="#fotos" class="outline">Ver fotos</a></div>
 </div>
</section>

<section id="sobre" class="about"><div class="wrap about-grid">
 <div><div class="title" style="text-align:left"><small>Conheça</small><h2 id="aboutTitle"></h2></div><div id="description" class="about-text"></div></div>
 <div class="info">
  <div id="addressCard" class="info-card"><b>📍 Endereço</b><span id="address"></span></div>
  <div id="instagramCard" class="info-card"><b>📷 Instagram</b><span id="instagram"></span></div>
  <div id="whatsappCard" class="info-card"><b>💬 WhatsApp</b><span id="whatsapp"></span></div>
 </div>
</div></section>

<section id="fotos"><div class="wrap"><div class="title"><small>Galeria</small><h2>Fotos</h2></div><div id="gallery" class="gallery"></div></div></section>

<section id="contato" class="contact"><div class="wrap"><h2>Entre em contato</h2><p id="contactText"></p><a id="contactWhats" class="cta" target="_blank" rel="noopener">Chamar no WhatsApp</a></div></section>
</main>

<footer><div class="wrap foot"><span id="copyright"></span><span class="powered">Site por DIVULGA<i>+</i>AQUI</span></div></footer>
</div>

<div id="lightbox" class="lightbox hidden" onclick="this.classList.add('hidden')"><img id="lightImg" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://rscdamfwtpvdbidbseqg.supabase.co';
const SUPABASE_KEY='sb_publishable_DvVDdR4CrGzuJToa6gYh3A_vV1m3-kk';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const cleanPhone=v=>String(v||'').replace(/\D/g,'');
function whatsLink(phone,name){let p=cleanPhone(phone);if(p && !p.startsWith('55'))p='55'+p;return p?`https://wa.me/${p}?text=${encodeURIComponent('Olá! Vi o site da '+name+' pelo DIVULGA+AQUI.')}`:'#contato'}
function showError(){ $('loading').classList.add('hidden');$('error').classList.remove('hidden') }
async function init(){
 const params=new URLSearchParams(location.search);
 let code=(params.get('codigo')||params.get('code')||'').trim().toUpperCase();
 if(!code){showError();return}
 const {data,error}=await sb.from('sites_clientes').select('*, sites_midias(*)').eq('codigo',code).eq('status','Publicado').maybeSingle();
 if(error||!data){console.error(error);showError();return}
 const pics=(data.sites_midias||[]).map(x=>x.url).filter(Boolean);
 document.title=data.nome+' | DIVULGA+AQUI';
 $('name').textContent=data.nome;
 $('aboutTitle').textContent=data.nome;
 $('heroDesc').textContent=data.descricao||'Produtos e serviços para você.';
 $('description').textContent=data.descricao||'Conheça nossos produtos e serviços. Entre em contato para mais informações.';
 $('contactText').textContent='Fale com '+data.nome+' e saiba mais.';
 $('address').textContent=data.endereco||'Consulte pelo WhatsApp';
 $('instagram').textContent=data.instagram||'Não informado';
 $('whatsapp').textContent=data.whatsapp||'Entre em contato';
 if(!data.endereco)$('addressCard').classList.add('hidden');
 if(!data.instagram)$('instagramCard').classList.add('hidden');
 const wl=whatsLink(data.whatsapp,data.nome);
 ['topWhats','heroWhats','contactWhats'].forEach(id=>$(id).href=wl);
 if(!data.whatsapp){$('topWhats').classList.add('hidden');$('heroWhats').classList.add('hidden');$('contactWhats').classList.add('hidden');$('whatsappCard').classList.add('hidden')}
 if(pics.length){
   $('heroBg').style.backgroundImage=`url("${pics[0]}")`;
   $('gallery').innerHTML=pics.map((u,i)=>`<img src="${u}" alt="Foto ${i+1} de ${data.nome}" loading="lazy" onclick="openPhoto('${u.replace(/'/g,"\\'")}')">`).join('');
 }else{
   $('fotos').classList.add('hidden');
 }
 $('copyright').textContent='© '+new Date().getFullYear()+' '+data.nome;
 $('loading').classList.add('hidden');$('site').classList.remove('hidden');
}
function openPhoto(url){$('lightImg').src=url;$('lightbox').classList.remove('hidden')}
init();
</script>
</body>
</html>
