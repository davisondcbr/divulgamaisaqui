<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e1b"><title>DIVULGAMAISAQUI • TV</title>
<style>
:root{color-scheme:dark;--bg:#080e1b;--card:#121e34;--line:#2b4263;--muted:#afc1da;--blue:#6c9eff}*{box-sizing:border-box}body{margin:0;background:#000;color:#f2f7ff;font:16px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}button,input{font:inherit}button{cursor:pointer}#surface{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}#surface video,#surface img{width:100%;height:100%;object-fit:contain}#message{position:fixed;bottom:12px;left:15px;background:#081327bc;border:1px solid #273a59;border-radius:10px;padding:7px 11px;color:#b7d1fa;font-size:12px;z-index:1;pointer-events:none;max-width:75%;opacity:.7}
#setup,#maintenance{position:fixed;inset:0;display:grid;place-items:center;z-index:10;padding:24px;background:radial-gradient(ellipse at 78% 10%,#243d72 0,transparent 50%),#080e1b;overflow:auto}.shell{width:min(100%,520px);background:linear-gradient(160deg,#172640,#101b30 90%);border:1px solid #37506d;border-radius:24px;padding:clamp(24px,4vw,42px);box-shadow:0 35px 100px #0009}.brand{font-size:30px;font-weight:850;margin-bottom:6px}.brand span{color:#77a6ff}.sub{color:var(--muted);line-height:1.6;font-size:14px}label{display:block;font-weight:700;font-size:13px;color:#d5e3f9;margin:18px 0 8px}input{width:100%;background:#0b1528;color:#fff;border:1px solid #405779;padding:16px;border-radius:12px;outline:none}input:focus{border-color:#7eaaff;box-shadow:0 0 0 4px #648cff22}.primary,.secondary,.danger{width:100%;border-radius:12px;padding:15px;font-weight:750;margin-top:14px;color:#fff}.primary{border:0;background:linear-gradient(105deg,#4975e6,#719dff)}.secondary{border:1px solid #456086;background:#223454}.danger{border:1px solid #814459;background:#4b2634}.feedback{min-height:22px;color:#ffb6b6;font-size:13px;margin-top:12px}.hidden{display:none!important}.pill{display:inline-block;border:1px solid #3c6381;color:#a9d9ed;padding:7px 11px;border-radius:30px;font-size:11px;font-weight:750}.actions{display:grid;gap:2px;margin-top:15px}
</style></head><body>
<div id="surface"></div><div id="message" aria-live="polite"></div>
<div id="setup"><div class="shell"><div class="brand">DIVULGA<span>MAISAQUI</span></div><div class="pill">ATIVAÇÃO DO DISPOSITIVO</div><h1>Conectar esta tela</h1><p class="sub">Informe o código e o PIN de 6 números gerados em <b>TV Boxes</b> no painel administrativo.</p><form id="setupForm"><label>Código da TV Box</label><input id="code" required autocomplete="off" autocapitalize="characters" placeholder="Ex.: 9988"><label>PIN da TV</label><input id="token" required type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" placeholder="6 números"><button class="primary" id="submit" type="submit">Ativar e iniciar reprodução →</button><p id="feedback" class="feedback"></p></form></div></div>
<div id="maintenance" class="hidden"><div class="shell"><div class="brand">Manutenção protegida</div><p class="sub">A reprodução está protegida. Digite a senha administrativa definida no painel.</p><form id="maintenanceForm"><label>Senha administrativa</label><input id="adminPassword" type="password" required autocomplete="off"><button class="primary" id="unlock" type="submit">Liberar manutenção</button><button class="secondary" type="button" onclick="closeMaintenance()">Cancelar e voltar aos anúncios</button><p id="maintenanceFeedback" class="feedback"></p></form><div id="maintenanceActions" class="actions hidden"><button class="secondary" type="button" onclick="closeMaintenance()">▶ Voltar à reprodução</button><button class="secondary" type="button" onclick="reconfigure()">⚙ Reconfigurar esta TV</button><button class="danger" type="button" onclick="exitApplication()">Sair do aplicativo</button></div></div></div>
<script>
'use strict';const BASE='https://rscdamfwtpvdbidbseqg.supabase.co',KEY='sb_publishable_DvVDdR4CrGzuJToa6gYh3A_vV1m3-kk';let code='',token='',queue=[],index=0,timer=0,pingTimer=0,syncTimer=0,playing=false,current='';const surface=document.getElementById('surface'),message=document.getElementById('message');
async function rpc(name,body){const r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(body),cache:'no-store'});let t=await r.text(),o;try{o=t?JSON.parse(t):null}catch{o=t}if(!r.ok)throw Error(o?.message||o||'Falha na conexão');return o}
function startLoops(){clearInterval(pingTimer);clearInterval(syncTimer);pingTimer=setInterval(ping,20000);syncTimer=setInterval(()=>sync().catch(e=>message.textContent='Sincronização: '+e.message),15000)}
async function sync(){const updated=await rpc('tv_playlist',{p_codigo:code,p_token:token});if(!Array.isArray(updated))throw Error('Playlist inválida');const before=JSON.stringify(queue);queue=updated;if(before!==JSON.stringify(queue)&&playing){index=0;playNext()}if(!playing&&queue.length){index=0;playNext()}if(!queue.length){playing=false;surface.replaceChildren();message.textContent='Aguardando anúncios para esta TV'}}
async function ping(){try{await rpc('tv_sinal',{p_codigo:code,p_token:token,p_reproduzindo:playing,p_anuncio:current||null})}catch(e){message.textContent='Sem comunicação com servidor: '+e.message}}
function playNext(){clearTimeout(timer);if(!queue.length){playing=false;return}let m=queue[index%queue.length];index++;current=m.id;let video=m.type==='video',el=document.createElement(video?'video':'img');el.src=m.url;el.onerror=()=>{message.textContent='Falha ao carregar '+m.name;timer=setTimeout(playNext,5000)};if(video){el.autoplay=true;el.muted=true;el.playsInline=true;el.onended=playNext;el.onloadeddata=()=>{message.textContent='Reproduzindo '+m.name;playing=true;ping()};el.play().catch(()=>{message.textContent='Falha ao reproduzir o vídeo';timer=setTimeout(playNext,5000)})}else{el.onload=()=>{message.textContent='Exibindo '+m.name;playing=true;ping();timer=setTimeout(playNext,(Number(m.duration)||10)*1000)}}surface.replaceChildren(el)}
function requestMaintenance(){if(!code||!token)return;document.getElementById('maintenance').classList.remove('hidden');document.getElementById('maintenanceActions').classList.add('hidden');document.getElementById('maintenanceForm').classList.remove('hidden');document.getElementById('adminPassword').value='';document.getElementById('maintenanceFeedback').textContent='';setTimeout(()=>document.getElementById('adminPassword').focus(),50)}window.DMA_REQUEST_MAINTENANCE=requestMaintenance;
function closeMaintenance(){document.getElementById('maintenance').classList.add('hidden');document.getElementById('adminPassword').value=''}
document.getElementById('maintenanceForm').onsubmit=async e=>{e.preventDefault();const password=document.getElementById('adminPassword').value,btn=document.getElementById('unlock'),fb=document.getElementById('maintenanceFeedback');btn.disabled=true;fb.textContent='Verificando senha...';try{const ok=await rpc('validar_senha_manutencao',{p_codigo:code,p_token:token,p_senha:password});if(ok!==true)throw Error('Senha incorreta');fb.textContent='';document.getElementById('maintenanceForm').classList.add('hidden');document.getElementById('maintenanceActions').classList.remove('hidden')}catch(err){fb.textContent=err.message||'Senha incorreta'}finally{btn.disabled=false}};
function reconfigure(){if(!confirm('Apagar a ativação salva desta TV e voltar à tela inicial?'))return;localStorage.removeItem('dmaq_tv_auth');location.reload()}
function exitApplication(){if(window.AndroidKiosk&&typeof window.AndroidKiosk.exitApp==='function')window.AndroidKiosk.exitApp();else alert('Saída do aplicativo disponível no APK Android.')}
document.getElementById('setupForm').onsubmit=async e=>{e.preventDefault();code=document.getElementById('code').value.trim().toUpperCase();token=document.getElementById('token').value.trim();const fb=document.getElementById('feedback');if(!/^\d{6}$/.test(token)){fb.textContent='O PIN deve possuir exatamente 6 números.';return}fb.textContent='Validando dispositivo...';document.getElementById('submit').disabled=true;try{await sync();localStorage.setItem('dmaq_tv_auth',JSON.stringify({code,token}));document.getElementById('setup').classList.add('hidden');fb.textContent='';await ping();startLoops()}catch(err){fb.textContent='Não foi possível ativar: '+err.message+' — confira o código, o PIN e a internet.'}finally{document.getElementById('submit').disabled=false}};
const saved=localStorage.getItem('dmaq_tv_auth');if(saved){try{const a=JSON.parse(saved);if(a.code&&a.token){code=a.code;token=a.token;document.getElementById('code').value=code;document.getElementById('token').value=token;document.getElementById('feedback').textContent='Reconectando dispositivo salvo...';document.getElementById('setupForm').requestSubmit()}}catch(e){localStorage.removeItem('dmaq_tv_auth')}}
</script></body></html>
