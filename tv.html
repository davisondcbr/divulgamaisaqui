<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIVULGAMAISAQUI • TV</title><style>*{box-sizing:border-box}body{margin:0;background:#05080e;color:#eef6ff;font:16px system-ui}#setup{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at top,#203c6b,#060b14 70%);z-index:5;padding:25px}#setup form{max-width:570px;width:100%;padding:32px;background:#17243b;border:1px solid #334965;border-radius:20px}h1{margin:0 0 12px}p{color:#bbcade}label{display:block;margin:14px 0 6px}input{background:#081629;color:white;border:1px solid #436080;padding:16px;border-radius:10px;width:100%;font:inherit}button{background:#5997fc;color:white;border:0;padding:14px;border-radius:10px;cursor:pointer;font:inherit;margin-top:18px}#surface{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:black}#surface video,#surface img{width:100%;height:100%;object-fit:contain}#message{position:fixed;bottom:5px;left:9px;background:#0009;color:#b3d0ff;font-size:12px;z-index:1}#exit{position:fixed;right:5px;top:5px;opacity:.10;z-index:2}#exit:focus,#exit:hover{opacity:1}</style></head><body><div id="surface"></div><div id="message" aria-live="polite"></div><button id="exit" onclick="showSetup()">Configurar</button><div id="setup"><form id="setupForm"><h1>DIVULGAMAISAQUI</h1><p>Ativação individual da TV Box. Use o código e a chave fornecidos no painel administrativo.</p><label>Código da TV Box</label><input id="code" required placeholder="TV-001" autocomplete="off"><label>Chave de ativação</label><input id="token" required type="password" autocomplete="off"><button type="submit">Ativar e iniciar reprodução</button><p id="feedback"></p></form></div><script>
'use strict';const BASE='https://rscdamfwtpvdbidbseqg.supabase.co',KEY='sb_publishable_DvVDdR4CrGzuJToa6gYh3A_vV1m3-kk';let code='',token='',queue=[],index=0,timer=0,pingTimer=0,syncTimer=0,playing=false,current='';const surface=document.getElementById('surface'),message=document.getElementById('message');
async function rpc(name,body){const r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(body),cache:'no-store'});let t=await r.text(),o;try{o=t?JSON.parse(t):null}catch{o=t}if(!r.ok)throw Error(o?.message||o||'Falha na conexão');return o;}
function showSetup(){clearTimeout(timer);clearInterval(pingTimer);clearInterval(syncTimer);playing=false;surface.replaceChildren();document.getElementById('setup').style.display='grid';}
async function sync(){const updated=await rpc('tv_playlist',{p_codigo:code,p_token:token});if(!Array.isArray(updated))throw Error('Playlist inválida');const before=JSON.stringify(queue);queue=updated;if(before!==JSON.stringify(queue)&&playing){index=0;playNext()}if(!playing&&queue.length){index=0;playNext()}if(!queue.length){playing=false;surface.replaceChildren();message.textContent='Aguardando anúncios para esta TV';}}
async function ping(){try{await rpc('tv_sinal',{p_codigo:code,p_token:token,p_reproduzindo:playing,p_anuncio:current||null})}catch(e){message.textContent='Sem comunicação com servidor: '+e.message}}
function playNext(){clearTimeout(timer);if(!queue.length){playing=false;return}let m=queue[index%queue.length];index++;current=m.id;let video=m.type==='video',el=document.createElement(video?'video':'img');el.src=m.url;el.onerror=()=>{message.textContent='Falha ao carregar '+m.name;timer=setTimeout(playNext,5000)};if(video){el.autoplay=true;el.muted=true;el.playsInline=true;el.onended=playNext;el.onloadeddata=()=>{message.textContent='Reproduzindo '+m.name;playing=true;ping()};el.play().catch(()=>{message.textContent='Falha ao reproduzir o vídeo';timer=setTimeout(playNext,5000)})}else{el.onload=()=>{message.textContent='Exibindo '+m.name;playing=true;ping();timer=setTimeout(playNext,(Number(m.duration)||10)*1000)}}surface.replaceChildren(el)}
document.getElementById('setupForm').onsubmit=async e=>{e.preventDefault();code=document.getElementById('code').value.trim().toUpperCase();token=document.getElementById('token').value.trim();document.getElementById('feedback').textContent='Validando dispositivo...';try{await sync();document.getElementById('setup').style.display='none';await ping();pingTimer=setInterval(ping,20000);syncTimer=setInterval(()=>sync().catch(err=>message.textContent='Sincronização: '+err.message),60000)}catch(err){document.getElementById('feedback').textContent='Ativação não autorizada: '+err.message}};
</script></body></html>
